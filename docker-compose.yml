services:
  mysql:
    image: mysql:8.0
    container_name: sonrisa-mysql
    environment:
      TZ: ${TZ:-Europe/Budapest}
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sonrisa_db
      MYSQL_USER: sonrisa_user
      MYSQL_PASSWORD: sonrisa_password
    ports:
      - '3306:3306'
    volumes:
      - ./sonrisa_db.sql:/docker-entrypoint-initdb.d/sonrisa_db.sql
      - mysql_data:/var/lib/mysql
    networks:
      - sonrisa-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sonrisa-phpmyadmin
    environment:
      TZ: ${TZ:-Europe/Budapest}
      PMA_HOST: mysql
      PMA_USER: sonrisa_user
      PMA_PASSWORD: sonrisa_password
      PMA_ROOT_PASSWORD: root_password
    ports:
      - '8080:80'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sonrisa-network

  backend:
    build: .
    container_name: sonrisa-backend
    environment:
      TZ: ${TZ:-Europe/Budapest}
      DB_HOST: mysql
      DB_USER: sonrisa_user
      DB_PASSWORD: sonrisa_password
      DB_NAME: sonrisa_db
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - sonrisa-network
    command: npm run dev

volumes:
  mysql_data:

networks:
  sonrisa-network:
    driver: bridge
